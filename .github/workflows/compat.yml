# Weekly: install the latest Slither, Aderyn, Solhint and cargo-audit, run them on the deliberately
# vulnerable samples and the safe contract, check the known bugs are still found (and the safe contract
# stays clean), and record versions and results for the website. Commits only when something changed,
# then redeploys. An analyzer that fails to install is a warning; one that stops finding known bugs fails.
name: Analyzer compatibility

on:
  schedule:
    - cron: "37 6 * * 3"     # Wednesdays 06:37 UTC
    - cron: "11 18 * * 6"    # Saturdays 18:11 UTC (a second slot: GitHub skips some scheduled runs)
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Slither and solc
        continue-on-error: true
        run: |
          pip install --upgrade slither-analyzer solc-select
          solc-select install 0.8.28 && solc-select use 0.8.28
      - name: Foundry (Slither compiles Foundry projects with forge)
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1
      - name: Solhint
        continue-on-error: true
        run: npm install -g solhint
      - name: cargo-audit
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Aderyn
        continue-on-error: true
        timeout-minutes: 25
        run: cargo install aderyn --locked
      - name: Lockfile for the Anchor sample (so cargo-audit has something to read)
        continue-on-error: true
        working-directory: samples/anchor
        run: cargo generate-lockfile
      - name: Run every analyzer on the samples
        run: node scripts/compat.mjs
      - name: Commit changed versions or results, then redeploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/data/compat.json; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/compat.json
          git commit -m "Analyzer compatibility: record this week's versions and results"
          git pull --rebase --autostash
          git push
          gh workflow run pages.yml
      - name: Record a regression in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ops-alert --color B42318 --description "Automated health check failed" 2>/dev/null || true
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --label ops-alert --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "Analyzer compatibility failed: $run"; else gh issue create --label ops-alert --title "Analyzer compatibility check failed" --body "An analyzer stopped finding known bugs, or flagged the safe contract: $run"; fi

  keepalive:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/keepalive.sh
