name: Bug
description: The hook, CLI, action or checker doesn't work as documented
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The deploy command or CLI command involved
  - type: input
    id: env
    attributes:
      label: Claude Code or Cursor version, OS, Node.js version
